---
mprlab_resources:
  owner: familyhome
  release:
    scheme: calver
  resources:
    private:
      kind: private_values
      bindings:
        device-token: FAMILYHOME_DEVICE_TOKEN
        llm-proxy-secret: LLM_PROXY_TENANT_KEY
    runtime:
      kind: compose_project
      images:
        service-image:
          repository: ghcr.io/marcopoloresearchlab/familyhome-service
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
            - linux/amd64
      volumes:
        data:
          name: familyhome-data
          retention: retain
      services:
        api:
          image: service-image
          placement:
            group: gateway
            cardinality: one
          environment:
            FAMILYHOME_DEVICE_TOKEN:
              resource: private
              output: device-token
            LLM_PROXY_SECRET:
              resource: private
              output: llm-proxy-secret
          mounts:
            /data:
              volume: data
          ports:
            '8765': {}
          readiness:
            protocol: http
            port: 8765
            path: /healthz
            expected_status: 200
    http:
      kind: runtime_capability
      name: familyhome.http
      version: 1
      project: runtime
      service: api
      endpoint:
        scope: same_host
        scheme: http
        alias: familyhome-api
        port: 8765
      health:
        protocol: http
        path: /healthz
        expected_status: 200
    public-api:
      kind: caddy_route
      hostname: familyhome-api.mprlab.com
      listener: https
      handlers:
        api:
          path_prefix: /
          upstream: familyhome.http
      tls:
        mode: automatic
      access:
        rate_limit:
          events: 120
          window_seconds: 60
    public-health:
      kind: health_check
      protocol: http
      url: https://familyhome-api.mprlab.com/healthz
      expected_status: 200
