---
mprlab_resources:
  owner: familyhome
  hosts:
    tutosh:
      ansible_become_password: DEPLOY_SUDO_PASSWORD_TUTOSH
  release:
    scheme: calver
  environment_file: .mprlab/deploy/.env
  inputs:
    FAMILYHOME_DEVICE_TOKEN: ${FAMILYHOME_DEVICE_TOKEN}
    LLM_PROXY_TENANT_KEY: ${LLM_PROXY_TENANT_KEY}
    DEPLOY_SUDO_PASSWORD_TUTOSH: ${DEPLOY_SUDO_PASSWORD_TUTOSH}
  ci:
    enabled: true
    command:
      "0": make
      "1": ci
  defaults:
    timeouts:
      startup: 2m
      completion: 30m
      readiness: 5m
      request: 30s
      shutdown: 30s
  operations:
    ci:
      timeouts:
        completion: 30m
    app_lifecycle.repository_read:
      polling: &lifecycle-polling
        initial: 2s
        maximum: 15s
        increment: 2s
        multiplier: 2
        attempt_limit: 60
    app-plan-release: &plan-policy
      timeouts:
        completion: 2m
      polling: *lifecycle-polling
    app-plan-publish: *plan-policy
    app-plan-deploy: *plan-policy
    app-release:
      timeouts:
        completion: 30m
      polling: *lifecycle-polling
    app-publish:
      timeouts:
        completion: 4h
      polling: *lifecycle-polling
    app-deploy:
      timeouts:
        completion: 20m
      polling: *lifecycle-polling
  resources:
    private:
      kind: private_values
      bindings:
        device-token: FAMILYHOME_DEVICE_TOKEN
        llm-proxy-secret: LLM_PROXY_TENANT_KEY
    runtime:
      kind: compose_project
      images:
        service-image:
          repository: ghcr.io/marcopoloresearchlab/familyhome-service
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
            - linux/amd64
      volumes:
        data:
          name: familyhome-data
          retention: retain
      services:
        api:
          image: service-image
          placement:
            group: gateway
            cardinality: one
          environment:
            FAMILYHOME_DEVICE_TOKEN:
              resource: private
              output: device-token
            LLM_PROXY_SECRET:
              resource: private
              output: llm-proxy-secret
          mounts:
            /data:
              volume: data
          ports:
            '8765': {}
          readiness:
            protocol: http
            port: 8765
            path: /healthz
            expected_status: 200
    http:
      kind: runtime_capability
      name: familyhome.http
      version: 1
      project: runtime
      service: api
      endpoint:
        scope: same_host
        scheme: http
        alias: familyhome-api
        port: 8765
      health:
        protocol: http
        path: /healthz
        expected_status: 200
    public-api:
      kind: caddy_route
      hostname: familyhome-api.mprlab.com
      listener: https
      handlers:
        api:
          path_prefix: /
          upstream: familyhome.http
      tls:
        mode: automatic
      access:
        rate_limit:
          events: 120
          window_seconds: 60
    public-health:
      kind: health_check
      protocol: http
      url: https://familyhome-api.mprlab.com/healthz
      expected_status: 200
