server:
  listen_address: "0.0.0.0:8765"
  data_dir: "/data"
  device_token: "${FAMILYHOME_DEVICE_TOKEN}"
llm_proxy:
  base_url: "https://llm-proxy-api.mprlab.com"
  secret: "${LLM_PROXY_SECRET}"
  provider: "openai"
  model: "gpt-5-mini"
  reasoning_effort: "low"
  request_timeout_seconds: 45
ask:
  transfer_allowance_seconds: 15
  question_character_limit: 2000
  recording_duration_seconds: 60
  audio_byte_limit: 6291456
  concurrent_request_limit: 1
